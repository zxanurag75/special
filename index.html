<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum of Us 🏛️✨</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: #fbf7f4;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        .app-container {
            width: 340px; height: 580px;
            background: #50bfa5; /* Teal Green */
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            position: relative; overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
            border: 4px solid #1a1a1a;
        }
        .screen {
            width: 100%; height: 100%;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px; box-sizing: border-box; text-align: center;
        }
        .screen.active { display: flex; }
        
        h2 { font-size: 18px; color: #1a1a1a; margin-bottom: 10px; font-weight: bold; }
        
        /* Same Polaroid Style White Frame */
        .card-frame {
            width: 80%; background: white; border: 3px solid #1a1a1a;
            border-radius: 16px; padding: 15px; box-shadow: 4px 4px 0px #1a1a1a;
            margin-bottom: 15px; text-align: center;
        }
        .pic-box {
            width: 100%; height: 190px;
            border: 2px solid #1a1a1a; border-radius: 10px;
            /* 👇 Yahan par maine ek bahut hi cute dosti ka animation gif set kar diya hai */
            background-image: url('https://giphy.com');
            background-size: cover; background-position: center;
            margin-bottom: 12px;
        }
        .btn-row { display: flex; gap: 15px; justify-content: center; width: 100%; position: relative; }
        .action-btn {
            padding: 8px 18px; font-weight: bold; border: 2px solid #1a1a1a;
            border-radius: 12px; cursor: pointer; box-shadow: 2px 2px 0px #1a1a1a;
            font-size: 12px;
        }
        .btn-delete { background: #ff6b6b; color: white; position: relative; transition: all 0.1s ease; }
        .btn-keep { background: #ffffff; color: #1a1a1a; }
        .btn-final { background: #ffd43b; color: #1a1a1a; width: 85%; padding: 12px; font-size: 14px; font-weight: bold; border: 2px solid #1a1a1a; border-radius: 12px; box-shadow: 3px 3px 0px #1a1a1a; cursor: pointer; }
        .accept-btn { background: #ffd43b; color: #1a1a1a; font-weight: bold; padding: 12px 25px; border: 3px solid #1a1a1a; border-radius: 12px; cursor: pointer; box-shadow: 4px 4px 0px #1a1a1a; font-size: 14px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- SCREEN 1: THE PRANK -->
    <div class="screen active" id="s1">
        <h2>Let's clean up our<br>friendship history.</h2>
        <div class="btn-row" style="margin-bottom: 15px;">
            <button class="action-btn btn-delete" id="del-btn" onmouseover="runAway()" onclick="runAway()">← DELETE</button>
            <button class="action-btn btn-keep" onclick="goToScreen(2)">KEEP →</button>
        </div>
        <div class="card-frame">
            <div class="pic-box"></div>
            <p style="font-size: 11px; font-weight: bold; color: #1a1a1a; margin: 0;">no takebacks!</p>
        </div>
    </div>

    <!-- SCREEN 2: FRIENDSHIP CARD -->
    <div class="screen" id="s2">
        <h2>Let's clean up our<br>friendship history.</h2>
        <div class="btn-row" style="margin-bottom: 15px;">
            <button class="action-btn btn-delete" style="opacity:0.5; cursor:not-allowed;" disabled>← DELETE</button>
            <button class="action-btn btn-keep" style="background:#ffd43b;">KEEP →</button>
        </div>
        <div class="card-frame">
            <div class="pic-box"></div>
            <p style="font-size: 14px; font-weight: bold; color: #ff3366; margin: 5px 0;">✨ Happy Friendship Day Roshni ✨</p>
            <p style="font-size: 11px; font-weight: bold; color: #1a1a1a; margin: 0;">no takebacks!</p>
        </div>
        <button class="btn-final" onclick="goToScreen(3)">NEXT STEPS →</button>
    </div>

    <!-- SCREEN 3: FINAL VERDICT -->
    <div class="screen" id="s3" style="background: #fbf7f4;">
        <h2>do NOT.</h2>
        <p style="font-size: 11px; font-weight: bold; color: #777; margin-top:0;">RESULT:</p>
        <h1 style="font-size: 20px; font-weight: 900; color: #1a1a1a; margin: 10px 0;">YOU KNOW WAY TOO MUCH.</h1>
        <p style="font-size: 13px; color: #555; line-height: 1.5; margin: 5px 20px;">Unfortunately, we are now friends for life.</p>
        
        <div style="background:#fff3cd; padding:6px 12px; border:2px dashed #ffeeba; border-radius:8px; font-size:11px; font-weight:bold; color:#b78103; margin: 10px 0;">
            NO CANCELLATIONS.<br>NO REFUNDS.
        </div>
        
        <button class="accept-btn" onclick="alert('System Locked! Dosti confirm ho gayi hai! 🤝❤️')">ACCEPT MY FATE</button>
    </div>

</div>

<script>
    function goToScreen(num) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('s' + num).classList.add('active');
    }

    function runAway() {
        const btn = document.getElementById('del-btn');
        const randomX = Math.floor(Math.random() * 120) - 60;
        const randomY = Math.floor(Math.random() * 80) - 40;
        btn.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }
</script>

</body>
</html>
