<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Friendship Day! ✨</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fff9db 0%, #fff3bf 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }
        .container {
            text-align: center;
            perspective: 1000px;
        }
        .envelope {
            width: 290px;
            height: 190px;
            background: #fab005; /* Cute Yellow Friendship Theme */
            position: relative;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
            cursor: pointer;
            transition: transform 0.4s ease;
            margin: 0 auto;
        }
        .envelope:hover {
            transform: translateY(-8px);
        }
        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            border-left: 145px solid transparent;
            border-right: 145px solid transparent;
            border-top: 105px solid #fcc419;
            transform-origin: top;
            transition: transform 0.4s ease 0.1s;
            z-index: 3;
        }
        .envelope.open::before {
            transform: rotateX(180deg);
            z-index: 1;
        }
        .seal {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 35px;
            z-index: 4;
            transition: all 0.3s ease;
        }
        .envelope.open .seal {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0);
        }
        .letter {
            width: 260px;
            background: white;
            padding: 25px 15px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            position: absolute;
            bottom: 15px;
            left: 15px;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
            opacity: 0;
        }
        .envelope.open .letter {
            opacity: 1;
            transform: translateY(-150px) scale(1.05);
            z-index: 5;
        }
        h2 { color: #e67e22; margin-top: 0; font-size: 22px; font-weight: bold; }
        p { color: #495057; font-size: 14px; line-height: 1.6; }
        .highlight { color: #f59f00; font-weight: bold; }
        .hint {
            color: #e67e22;
            font-weight: bold;
            margin-top: 20px;
            font-size: 15px;
            animation: bounce 1.5s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="envelope" id="envelope" onclick="openLetter()">
        <div class="seal">⭐</div>
        <div class="letter">
            <h2>Happy Friendship Day! 🌸</h2>
            <p>Bhai sach btau, life mein bahut saare dost aate jaate hain, par tum jaisa <span class="highlight">saccha aur best dost</span> milna sach mein naseeb ki baat hai.</p>
            <p>Har mazaak, har help, aur har baat ke liye Thank You! Humari dosti hamesha aisi hi rahegi. ✨🤝</p>
        </div>
    </div>
    <div class="hint" id="hint-text">Ispar click karke open karo... 🎁</div>
</div>

<script>
    function openLetter() {
        const env = document.getElementById('envelope');
        const hint = document.getElementById('hint-text');
        env.classList.toggle('open');
        if(env.classList.contains('open')) {
            hint.innerHTML = "Humari pyaari dosti ke naam! 🤝✨";
        } else {
            hint.innerHTML = "Ispar click karke open karo... 🎁";
        }
    }
</script>

</body>
</html>
